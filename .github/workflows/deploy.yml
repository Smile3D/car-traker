name: Deploy to VM

# CD: after a successful image build, SSH to the GCE VM (via IAP) and
# recreate the matching docker compose service with the new :latest image.
#
# Required GitHub secrets:
#   GCP_SA_KEY            — same SA used for Artifact Registry push; needs
#                           roles/iap.tunnelResourceAccessor,
#                           roles/compute.instanceAdmin.v1 (or narrower SSH perms),
#                           roles/iam.serviceAccountUser on the VM SA
#   VM_SSH_PRIVATE_KEY    — private key for VM_SSH_USER (e.g. garage-tracker-vm)
#
# Required GitHub variables (Settings → Variables), or defaults below:
#   VM_NAME               — default: car-garage-tracker
#   VM_ZONE               — default: europe-central2-a
#   VM_SSH_USER           — default: pavlo
#   DEPLOY_DIR            — default: /home/pavlo/car-traker
#
# Terraform: allow IAP to SSH (tcp/22 from 35.235.240.0/20) on the VM network tag.

on:
  workflow_call:
    inputs:
      service:
        description: Which compose service to redeploy
        required: true
        type: string

  workflow_dispatch:
    inputs:
      service:
        description: Which compose service to redeploy
        required: true
        type: choice
        options:
          - all
          - backend
          - frontend

env:
  GCP_PROJECT_ID: car-garage-tracker
  VM_NAME: ${{ vars.VM_NAME || 'car-garage-tracker' }}
  VM_ZONE: ${{ vars.VM_ZONE || 'europe-central2-a' }}
  VM_SSH_USER: ${{ vars.VM_SSH_USER || 'pavlo' }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/pavlo/car-traker' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gcloud beta components for IAP tunnel
        run: gcloud components install beta --quiet || true

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy on VM
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          REMOTE_CMD="set -euo pipefail; cd '${DEPLOY_DIR}'; bash scripts/deploy-on-vm.sh '${SERVICE}'"
          gcloud compute ssh "${VM_SSH_USER}@${VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${VM_ZONE}" \
            --ssh-key-file="${HOME}/.ssh/deploy_key" \
            --strict-host-key-checking=no \
            --tunnel-through-iap \
            --command="${REMOTE_CMD}"
