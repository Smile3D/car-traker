name: Deploy to VM

# CD via appleboy/ssh-action: pull new image(s) and `compose up -d` (no down).
#
# Secrets:
#   VM_HOST              — VM public IP
#   VM_SSH_PRIVATE_KEY   — private key for VM_USERNAME
#   VM_USERNAME          — optional if set as variable; default pavlo via env below
#
# Variables (optional):
#   VM_USERNAME          — default: pavlo
#   DEPLOY_DIR           — default: /home/pavlo/car-traker
#
# Note: SSH firewall must allow GitHub Actions runners (or your self-hosted
# runner IP). Your current terraform only allows two fixed IPs.

on:
  workflow_call:
    inputs:
      service:
        description: Which compose service to redeploy
        required: true
        type: string
      image_tag:
        description: Image tag to deploy (git SHA or latest)
        required: false
        type: string
        default: latest

  workflow_dispatch:
    inputs:
      service:
        description: Which compose service to redeploy
        required: true
        type: choice
        options:
          - all
          - backend
          - frontend
      image_tag:
        description: Image tag to deploy
        required: false
        type: string
        default: latest

env:
  VM_USERNAME: ${{ vars.VM_USERNAME || 'pavlo' }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/pavlo/car-traker' }}
  GAR_LOCATION: europe-central2

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ env.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export IMAGE_TAG='${{ inputs.image_tag }}'
            gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
            cd ${{ env.DEPLOY_DIR }}
            bash scripts/deploy-on-vm.sh '${{ inputs.service }}'
